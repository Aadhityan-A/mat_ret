[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mat_ret"
version = "0.4.0"
description = "Unified retrieval and property mapping for materials databases (Materials Project, JARVIS, AFLOW, Alexandria, Materials Cloud, MPDS)"
authors = [
    { name = "Aadhityan A", email = "aadhityan1995@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pymatgen",
    "requests",
    "numpy",
    "scipy",
    "mp-api",
    "jarvis-tools",
    "optimade[http_client]",
    "zstandard",
    "ase",
    "aflow",
    "matplotlib",
    "pandas",
    "tqdm",
    "urllib3",
    "mpds-client",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "PyOpenGL>=3.1.0",
]
mongodb = [
    "pymongo>=4.0",
]
dev = [
    "pytest>=7.0",
    "mongomock>=4.0",
]

[project.scripts]
mat-ret-gui = "mat_ret.gui:main"

[project.urls]
Homepage = "https://github.com/Aadhityan-A/mat_ret"
BugTracker = "https://github.com/Aadhityan-A/mat_ret/issues"

[tool.setuptools.packages.find]
where = ["src"]
